# Checks — automatic on push to main; PR runs wait at `approve` until a reviewer approves in the
# `approval` environment. Release requires a successful run on main HEAD.
# Required checks (default-branch ruleset): "checks" and "security". See mattas-net/.github STANDARD.md.
# python-service without an image: the shared `python` job covers lint, type-check, the fast
# utility tests, the notebook drift check, the repo contract tests and the dependency audit.
# The repo-specific jobs (Spark shards, local E2E, Windows, documentation) feed the `checks`
# alias, which requires all of them.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approve:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: approval
    steps:
      - run: echo "Checks approved by ${GITHUB_TRIGGERING_ACTOR}"

  python:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    uses: mattas-net/.github/.github/workflows/python-ci.yml@main
    permissions:
      contents: read
    with:
      working-directory: utility
      python-versions: '["3.12", "3.13"]'
      install: |
        python -m pip install --require-hashes -r requirements-ci.txt
        python -m pip install --no-deps -e .
      audit-install: |
        python -m pip install --require-hashes -r requirements-ci.txt
        python -m pip install --no-deps -e .
      lint-paths: src tests scripts
      # mypy backlog (147 errors in src at the time of onboarding): report, do not block.
      typecheck: python -m mypy src
      typecheck-blocking: false
      test: python -m pytest -q -m "not spark"
      extra-checks: |
        python scripts/build_notebooks.py --check
        cd "$GITHUB_WORKSPACE"
        PYTHONPATH=. python -m pytest -q --ignore=tests/docs
      build: false
      audit: strict

  spark-tests:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: utility/requirements-ci.txt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked test dependencies
        working-directory: utility
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Run discovered Spark shard
        working-directory: utility
        run: >-
          python scripts/run_ci_shards.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4
          --max-tests-per-process 8

  spark-e2e:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: utility/requirements-ci.txt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked test dependencies
        working-directory: utility
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Run local E2E test
        working-directory: utility
        run: python -m pytest -q -m e2e

  windows-tests:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: utility/requirements-ci.txt

      - name: Install locked test dependencies
        working-directory: utility
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Run Windows utility tests
        working-directory: utility
        run: python -m pytest -q -m "not spark"

      - name: Set up Java for non-filesystem Spark smoke tests
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Windows Spark expression smoke tests
        working-directory: utility
        env:
          TMPDIR: ${{ runner.temp }}
          SPARK_LOCAL_HOSTNAME: localhost
        run: python -m pytest -q -m "spark and spark_no_filesystem"

      - name: Notebook drift check
        working-directory: utility
        run: python scripts/build_notebooks.py --check

      - name: Run Windows repository contracts
        run: python -m pytest -q --ignore=tests/docs
        env:
          PYTHONPATH: .

  docs-tests:
    needs: approve
    if: always() && needs.approve.result != 'failure' && needs.approve.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-test.txt

      - name: Install documentation tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-docs.txt
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt

      - name: Run documentation tests
        run: python -m pytest tests/docs -q

      - name: Build current and versioned documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m zensical build --clean
          python scripts/publish_versioned_docs.py --branch docs-version-ci

  checks:
    needs: [python, spark-tests, spark-e2e, windows-tests, docs-tests]
    if: always()   # a skipped required check counts as passing, so always run and assert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared checks job and every repo-specific test job
        env:
          PYTHON_RESULT: ${{ needs.python.outputs.checks-result }}
          SPARK_RESULT: ${{ needs.spark-tests.result }}
          E2E_RESULT: ${{ needs.spark-e2e.result }}
          WINDOWS_RESULT: ${{ needs.windows-tests.result }}
          DOCS_RESULT: ${{ needs.docs-tests.result }}
        run: |
          for result in \
            "$PYTHON_RESULT" \
            "$SPARK_RESULT" \
            "$E2E_RESULT" \
            "$WINDOWS_RESULT" \
            "$DOCS_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Required check finished with status: ${result:-<none>}"
              exit 1
            fi
          done

  security:
    needs: python
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared security job
        env:
          RESULT: ${{ needs.python.outputs.security-result }}
        run: test "$RESULT" = success
