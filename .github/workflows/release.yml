# Release: Actions -> Release -> enter a bare-semver version (e.g. 1.4.2) that
# utility/pyproject.toml on main already carries (bump it on a dev/* branch first). Tags main,
# creates the GitHub Release, then publishes the docs for that version. No image: retail-demo is
# deployed from the release tag, so there is no docker-build-push job.
# Shape and inputs: mattas-net/.github STANDARD.md ("release.yml").
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (bare semver, e.g. 1.4.2)
        required: true
        type: string
jobs:
  release:
    uses: mattas-net/.github/.github/workflows/create-release.yml@main
    permissions:
      contents: write
      actions: read
    with:
      version: ${{ inputs.version }}
      manifest: utility/pyproject.toml
      require-workflow: Checks
  docs:
    needs: release
    permissions:
      contents: write # docs.yml: the publish script pushes the gh-pages branch
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ inputs.version }}
