<!DOCTYPE html>
<html lang="en">

  <title>Ontology Explorer — Retail Intelligence</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>

      <a class="tab" href="/studio.html">Story Studio</a>

  <main class="layout">

      </div>
