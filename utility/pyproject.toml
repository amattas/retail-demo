[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "retail-setup"
version = "0.1.0"
description = "Fabric-native setup utility: historical data generation + environment configuration"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "ruff>=0.4", "mypy>=1.8", "pyspark>=3.5.2,<4.3", "pyarrow>=14", "pandas>=2.0", "numpy>=1.26"]
deploy = [
    "azure-identity>=1.25.3,<2",
    "azure-kusto-data>=6.0.4,<7",
    "fabric-cicd==1.4.0",
    "mssql-python>=1.12,<2; sys_platform != 'darwin'",
    "pyodbc>=5.1,<6",
]
spark = [
    "numpy>=1.26",
    "pyarrow>=14",
    "pyspark>=3.5.2,<4.3",
]  # local testing; Fabric provides Spark at runtime

[project.scripts]
retail-setup = "retail_setup.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_setup"]

[tool.hatch.build.targets.wheel.force-include]
"data/dictionaries" = "retail_setup/resources/dictionaries"
"notebooks/setup-01-seed-dictionaries.ipynb" = "retail_setup/resources/notebooks/setup-01-seed-dictionaries.ipynb"
"notebooks/setup-02-generate-dimensions.ipynb" = "retail_setup/resources/notebooks/setup-02-generate-dimensions.ipynb"
"notebooks/setup-03-generate-sales.ipynb" = "retail_setup/resources/notebooks/setup-03-generate-sales.ipynb"
"notebooks/setup-04-generate-online-orders.ipynb" = "retail_setup/resources/notebooks/setup-04-generate-online-orders.ipynb"
"notebooks/setup-05-generate-marketing.ipynb" = "retail_setup/resources/notebooks/setup-05-generate-marketing.ipynb"
"notebooks/setup-06-generate-returns-and-promotions.ipynb" = "retail_setup/resources/notebooks/setup-06-generate-returns-and-promotions.ipynb"
"notebooks/setup-07-generate-store-activity.ipynb" = "retail_setup/resources/notebooks/setup-07-generate-store-activity.ipynb"
"notebooks/setup-08-generate-inventory.ipynb" = "retail_setup/resources/notebooks/setup-08-generate-inventory.ipynb"
"notebooks/setup-09-attribute-marketing.ipynb" = "retail_setup/resources/notebooks/setup-09-attribute-marketing.ipynb"
"notebooks/setup-10-publish-silver.ipynb" = "retail_setup/resources/notebooks/setup-10-publish-silver.ipynb"
"notebooks/setup-11-build-gold.ipynb" = "retail_setup/resources/notebooks/setup-11-build-gold.ipynb"
"notebooks/stream-events.ipynb" = "retail_setup/resources/notebooks/stream-events.ipynb"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Ruff 0.16 expanded its defaults substantially; preserve the existing gate.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: requires a local Spark runtime",
    "spark_no_filesystem: Spark expression checks that do not require Hadoop filesystem helpers",
    "e2e: exercises the complete local generation and publication path",
]
