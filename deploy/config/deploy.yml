subscription_id: null
# Native public API publication only; never included in fabric-cicd's item scope.
# The Operations Agent deploys whenever the profile supports it (enabled defaults to
# true for standard/full-demo); a Fabric rejection warns instead of failing.
operations_planning:
  # Planning needs a fixed-credential connection and starts billing that cannot be cancelled.
  include_plan: false
  # Shared Power BI Semantic Model connection; used only when include_plan is true.
  plan_connection_id: null
  # Explicit consent: Planning can start a non-cancellable 30-day billable session.
  plan_billing_acknowledged: false
  recipient: null
  # Start the Operations Agent after Fabric generates its playbook. A running
  # agent queries every five minutes (about 0.46 CU-hours per active hour) and
  # sends Teams recommendations to its creator or recipient.
  activate_agent: true
# Connected twins publish whenever the profile includes Reporting.
twins: {}
# Committed pipeline schedules to enable; each applies only when the profile
# deploys that pipeline. Scheduled runs fail while the capacity is paused.
schedules:
  # Nightly at 00:00 Eastern: Delta OPTIMIZE/VACUUM (about 10 minutes on F64),
  # then the demand-forecast and stockout models and the Operations Agent
  # signal refresh (17-refresh-availability-signals).
  daily_maintenance: true
  # Every 30 minutes (UTC): streaming Silver then Gold, plus anomaly-alert
  # persistence; useful only while stream-events is producing events. null
  # follows stream.start_after_deploy, so a started stream is always moved to
  # Silver before Eventhouse retention (7 days for some tables) purges it.
  streaming_data_load: null
# Start the live stream-events notebook after deployment. A running stream holds
# a Spark session (and capacity) until it stops.
stream:
  start_after_deploy: false
  # 0 derives the rate from the store count and history volume; a larger value
  # adds resolution, not volume (the notebook's volume_scale changes volume).
  rows_per_second: 0
  # 0 runs until the notebook job is cancelled in Fabric.
  run_seconds: 0
auth:
  mode: azure_cli
workspace:
  description: Microsoft Fabric retail demo workspace
  existing_id: null
  capacity_id: null
  capacity_resource_id: null
  skip_capacity_state_validation: false
  role_assignments: []
lakehouse:
  name: retail_lakehouse
  enable_schemas: true
eventhouse:
  name: retail_eventhouse
  minimum_consumption_units: null
  kql_database_name: retail_eventhouse
  kql_scripts:
  - 01-create-tables.kql
  - 02-create-ingestion-mappings.kql
  - 03-create-functions.kql
  - 04-create-materialized-views.kql
  - 06-ml-anomaly-detection.kql
  - 07-pricing-approval-tables.kql
spark:
  use_custom_pool: false
  custom_pool_name: retail_setup_pool
  node_size: Medium
  min_node_count: 2
  max_node_count: 16
notebooks:
  default_lakehouse_name: retail_lakehouse
powerbi:
  semantic_model_name: retail_model
  report_name: retail_model
  semantic_model_connection_id: null
  refresh_after_deploy: false
deployment:
  profile: full-demo
  item_types_in_scope:
  - Lakehouse
  - Notebook
  - SemanticModel
  - Report
  - KQLQueryset
  - DataPipeline
  - MLExperiment
  - DataAgent
  publish_skip: false
  unpublish_skip: true
  orphan_exclude_regex: ^DO_NOT_DELETE_.*
  feature_flags: []
